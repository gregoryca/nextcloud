name: Deploy Compose file for Nextcloud

on:
  workflow_dispatch:
    inputs:
      DEPLOY_HOST:
        description: Optional target hostname (devops.headscale.node or nextcloud.headscale.node); leave blank for both.
        required: false
        type: string
        default: "nextcloud.headscale.node"
      compose_deploy_docker_stack_name:
        description: Stack name override for selected host(s).
        required: true
        type: string
        default: nextcloud
      compose_deploy_docker_compose_file:
        description: Compose file override, relative to each stack path.
        required: true
        type: string
        default: docker-compose.yml
      deploy_user:
        description: User to connect to the hosts.
        required: false
        type: string
        default: "gregory"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    uses: gregoryca/apex-migrations-framework/.github/workflows/deploy-compose.yml@main
    with:
      DEPLOY_HOST: ${{ inputs.DEPLOY_HOST }}
      DOCKER_STACK_NAME: ${{ inputs.DOCKER_STACK_NAME }}
      DOCKER_COMPOSE_FILE: ${{ inputs.DOCKER_COMPOSE_FILE }}
      DOCKER_STACK_PATH: ${{ inputs.DOCKER_STACK_PATH }}
    secrets:
      ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
